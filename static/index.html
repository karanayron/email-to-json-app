<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email to JSON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #05070d;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.02) 100%);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.32);
      --surface-inner: rgba(6, 10, 20, 0.58);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --error: #fb7185;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient reflective light orbs behind the glass */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.42;
    }

    .orb-1 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, #38bdf8 0%, transparent 70%);
      top: -120px;
      left: -80px;
    }

    .orb-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      bottom: -160px;
      right: -100px;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #e2e8f0 0%, transparent 70%);
      top: 38%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.12;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1080px;
    }

    /* Minimal Header */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .title-group h1 {
      font-size: clamp(1.45rem, 2.5vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      color: var(--text-secondary);
      font-size: 0.92rem;
      margin-top: 0.3rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .status-dot.loading {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .status-dot.error {
      background: var(--error);
      box-shadow: 0 0 10px var(--error);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Responsive Two-Column Workspace */
    .workspace {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 840px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    /* Mirror / Frosted Glass Card */
    .glass-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-highlight);
      border-left-color: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      overflow: hidden;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    /* Subtle diagonal mirror sheen */
    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        125deg,
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.02) 32%,
        transparent 52%
      );
      pointer-events: none;
    }

    .card-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.9rem;
    }

    .card-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      gap: 0.45rem;
    }

    /* Recessed Dark Glass Input & Output */
    textarea,
    pre {
      position: relative;
      width: 100%;
      height: 360px;
      background: var(--surface-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 1rem 1.1rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      line-height: 1.6;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea {
      font-family: "Inter", sans-serif;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: #64748b;
    }

    textarea:focus {
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.45),
        0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    pre {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.84rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Subtle custom scrollbars */
    textarea::-webkit-scrollbar,
    pre::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    textarea::-webkit-scrollbar-thumb,
    pre::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    /* Buttons */
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    .card-footer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn-primary {
      position: relative;
      overflow: hidden;
      flex: 1;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(203, 213, 225, 0.88) 100%);
      color: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      padding: 0.72rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow:
        0 8px 20px -6px rgba(255, 255, 255, 0.28),
        inset 0 1px 0 #ffffff;
      transition: transform 0.18s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    /* Reflective sweep on hover */
    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
      transform: skewX(-25deg);
      transition: left 0.55s ease;
    }

    .btn-primary:hover::after {
      left: 150%;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -6px rgba(255, 255, 255, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      font-size: 0.76rem;
      color: #64748b;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .hint { display: none; }
      textarea, pre { height: 280px; }
    }

    .error-banner {
      display: none;
      margin-top: 0.8rem;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      background: rgba(251, 113, 133, 0.1);
      border: 1px solid rgba(251, 113, 133, 0.28);
      color: #fda4af;
      font-size: 0.83rem;
    }

    /* JSON Syntax Highlighting */
    .json-placeholder { color: #64748b; font-style: italic; }
    .json-key { color: #7dd3fc; }
    .json-string { color: #a7f3d0; }
    .json-number { color: #fcd34d; }
    .json-boolean { color: #c4b5fd; }
    .json-null { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="shell">
    <header>
      <div class="title-group">
        <h1>Email to JSON</h1>
        <p>Convert unstructured emails into clean, structured payloads.</p>
      </div>
      <div class="status-pill">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <section class="workspace">
      <!-- Input Panel -->
      <div class="glass-card">
        <div class="card-header">
          <span class="card-label">Raw Email</span>
          <div class="header-actions">
            <button type="button" class="btn-ghost" onclick="loadSample()">Sample</button>
            <button type="button" class="btn-ghost" onclick="clearAll()">Clear</button>
          </div>
        </div>

        <textarea
          id="emailInput"
          placeholder="Paste an email thread, support ticket, or inquiry here..."
          spellcheck="false"
        ></textarea>

        <div class="card-footer">
          <button id="extractBtn" class="btn-primary" onclick="extractJSON()">Extract JSON</button>
          <span class="hint">Ctrl + Enter</span>
        </div>

        <div id="errorBanner" class="error-banner"></div>
      </div>

      <!-- Output Panel -->
      <div class="glass-card">
        <div class="card-header">
          <span class="card-label">Structured JSON</span>
          <div class="header-actions">
            <button id="copyBtn" type="button" class="btn-ghost" onclick="copyOutput()">Copy</button>
          </div>
        </div>

        <pre id="jsonOutput"><span class="json-placeholder">// Structured output will appear here...</span></pre>
      </div>
    </section>
  </main>

  <script>
    let lastRawJson = "";

    const emailInput = document.getElementById("emailInput");
    const jsonOutput = document.getElementById("jsonOutput");
    const extractBtn = document.getElementById("extractBtn");
    const copyBtn = document.getElementById("copyBtn");
    const errorBanner = document.getElementById("errorBanner");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    // Keyboard shortcut: Ctrl+Enter / Cmd+Enter to extract
    emailInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        extractJSON();
      }
    });

    function setStatus(state, text) {
      statusDot.className = "status-dot" + (state ? ` ${state}` : "");
      statusText.textContent = text;
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.style.display = "none";
    }

    function loadSample() {
      clearError();
      emailInput.value =
`Hey team,
This is Rohan from Apex Logistics. Our payment gateway threw a 500 error twice today during checkout and customers are dropping off. Can someone from your tech team hop on a quick call before 4 PM tomorrow (Nov 23, 2026) and also send over the error logs? Pretty urgent on our end.
Thanks,
Rohan`;
      emailInput.focus();
    }

    function clearAll() {
      emailInput.value = "";
      lastRawJson = "";
      jsonOutput.innerHTML = '<span class="json-placeholder">// Structured output will appear here...</span>';
      clearError();
      setStatus("", "Ready");
    }

    function syntaxHighlight(jsonStr) {
      const escaped = jsonStr
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      return escaped.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        (match) => {
          let cls = "json-number";
          if (/^"/.test(match)) {
            cls = /:$/.test(match) ? "json-key" : "json-string";
          } else if (/true|false/.test(match)) {
            cls = "json-boolean";
          } else if (/null/.test(match)) {
            cls = "json-null";
          }
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    async function extractJSON() {
      const emailText = emailInput.value.trim();
      clearError();

      if (!emailText) {
        showError("Paste an email before extracting.");
        return;
      }

      extractBtn.disabled = true;
      extractBtn.textContent = "Extracting...";
      setStatus("loading", "Processing");
      jsonOutput.innerHTML = '<span class="json-placeholder">// Analyzing email...</span>';

      try {
        const res = await fetch("/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email_text: emailText })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Extraction failed.");

        lastRawJson = JSON.stringify(data, null, 2);
        jsonOutput.innerHTML = syntaxHighlight(lastRawJson);
        setStatus("", "Extracted");
      } catch (err) {
        lastRawJson = "";
        jsonOutput.innerHTML = '<span class="json-placeholder">// Unable to parse response</span>';
        showError(err.message);
        setStatus("error", "Error");
      } finally {
        extractBtn.disabled = false;
        extractBtn.textContent = "Extract JSON";
      }
    }

    async function copyOutput() {
      if (!lastRawJson) return;
      try {
        await navigator.clipboard.writeText(lastRawJson);
        copyBtn.textContent = "Copied";
        setTimeout(() => { copyBtn.textContent = "Copy"; }, 1600);
      } catch {
        showError("Could not copy to clipboard.");
      }
    }
  </script>
</body>
</html>
